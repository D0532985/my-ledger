    </style>

    <div class="bg-white shadow-sm sticky top-0 z-20 p-4 flex justify-around text-sm" id="tabs">

            <p class="font-bold text-red-500" id="expSum">0</p>

        <div class="bg-white p-3 rounded-xl shadow-sm border-t-4 border-green-400">
            <p class="text-[10px] text-gray-400">收入</p>
            <p class="font-bold text-green-500" id="incSum">0</p>
        </div>
        <div class="bg-white p-3 rounded-xl shadow-sm border-t-4 border-blue-400">

            </div>
            <button id="saveBtn" onclick="submitData()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg">儲存到雲端</button>
        </div>
    </div>
