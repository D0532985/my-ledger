<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的雲端帳本</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .active { border-bottom: 3px solid #3b82f6; color: #3b82f6; font-weight: bold; }
        .card-fade { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 pb-24">

    <div class="bg-white shadow-sm sticky top-0 z-20 p-4 flex justify-around text-sm" id="tabs">
        <button onclick="changeTab('day', this)">日</button>
        <button onclick="changeTab('month', this)">月</button>
        <button onclick="changeTab('year', this)">年</button>
        <button onclick="changeTab('all', this)" class="active">全部</button>
    </div>

    <div class="p-4 grid grid-cols-3 gap-2 text-center">
        <div class="bg-white p-3 rounded-xl shadow-sm border-t-4 border-red-400">
            <p class="text-[10px] text-gray-400 uppercase">支出</p>
            <p class="font-bold text-red-500" id="exp">0</p>
        </div>
        <div class="bg-white p-3 rounded-xl shadow-sm border-t-4 border-green-400">
            <p class="text-[10px] text-gray-400 uppercase">收入</p>
            <p class="font-bold text-green-500" id="inc">0</p>
        </div>
        <div class="bg-white p-3 rounded-xl shadow-sm border-t-4 border-blue-400">
            <p class="text-[10px] text-gray-400 uppercase">結餘</p>
            <p class="font-bold text-blue-600" id="bal">0</p>
        </div>
    </div>

    <div id="list" class="px-4 space-y-3 text-center text-gray-400 py-10 italic">
        雲端資料同步中...
    </div>

    <div class="fixed bottom-6 right-6">
        <button onclick="openModal()" class="bg-blue-600 text-white w-14 h-14 rounded-full shadow-2xl text-3xl flex items-center justify-center hover:bg-blue-700 transition-all">+</button>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 space-y-4 card-fade">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-lg text-gray-700">新增收支紀錄</h3>
                <button onclick="closeModal()" class="text-gray-400 text-2xl">&times;</button>
            </div>
